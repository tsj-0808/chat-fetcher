name: Fetch ChatGPT Full Dialogue

on:
  workflow_dispatch:
    inputs:
      share_url:
        description: '请粘贴完整的 ChatGPT 分享链接'
        required: true
        default: 'https://chatgpt.com/share/...'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Fetch and Parse Full Dialogue
        run: |
          python - << 'EOF'
          import json
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          url = "${{ github.event.inputs.share_url }}".strip()
          print(f"正在抓取链接: {url}")

          # 模拟 Chrome 浏览器指纹，避免触发拦截
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8"
          }
          resp = requests.get(url, headers=headers, impersonate="chrome120", timeout=30)
          
          soup = BeautifulSoup(resp.text, 'html.parser')
          data = None

          # 优先解析 __NEXT_DATA__
          script_tag = soup.find('script', id='__NEXT_DATA__')
          if script_tag and script_tag.string:
              try:
                  data = json.loads(script_tag.string)
              except Exception:
                  pass

          # 备用方案：正则表达式匹配 JSON 数据块
          if not data:
              match = re.search(r'\{"props":.*?"pageProps":.*?\}(?=</script>)', resp.text)
              if match:
                  try:
                      data = json.loads(match.group(0))
                  except Exception:
                      pass

          output_lines = []
          if data:
              props = data.get('props', {}).get('pageProps', {})
              server_response = props.get('serverResponse', {}).get('data', {})
              title = server_response.get('title', 'ChatGPT 对话记录')
              output_lines.append(f"# {title}\n\n")

              mapping = server_response.get('mapping', {})
              current_id = server_response.get('current_node')

              # 按照节点链路回溯完整上下文顺序
              ordered_nodes = []
              if current_id and current_id in mapping:
                  curr = current_id
                  while curr and curr in mapping:
                      node = mapping[curr]
                      ordered_nodes.append(node)
                      curr = node.get('parent')
                  ordered_nodes.reverse()
              else:
                  ordered_nodes = list(mapping.values())

              for node in ordered_nodes:
                  msg = node.get('message')
                  if msg and msg.get('content') and msg.get('author'):
                      role = msg['author'].get('role', '')
                      if role in ['user', 'assistant']:
                          parts = msg['content'].get('parts', [])
                          text = "\n".join([str(p) for p in parts if isinstance(p, str)])
                          if text.strip():
                              prefix = "### 👤 用户" if role == "user" else "### 🤖 ChatGPT"
                              output_lines.append(f"{prefix}\n\n{text.strip()}\n\n---\n\n")

          result = "".join(output_lines)
          
          if not result.strip():
              print("警告：未解析出结构化问答，将保存原始 HTML 以供查看。")
              result = resp.text

          with open("dialogue_full.md", "w", encoding="utf-8") as f:
              f.write(result)
          print("提取完成！已生成 dialogue_full.md")
          EOF

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt_full_dialogue
          path: dialogue_full.md
